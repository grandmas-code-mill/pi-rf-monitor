[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-rf-monitor"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]
readme = "README.md"
license = "Unlicense"
keywords = ["raspbian", "raspberry pi", "rtlsdr", "radio", "DSP", "AWS"]

[project.optional-dependencies]
sdr = ["pyrtlsdr"]          # For RTL-SDR dongle when connected to Pi
dev = ["pytest", "ruff"]    # Linting and unit testing.

[project.scripts]
rfmon = "rfmon.cli:main"  

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
